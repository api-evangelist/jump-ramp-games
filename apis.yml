name: Jump Ramp Games
description: Jump Ramp Games was a New York City casual mobile gaming company best known for Lucktastic,
  a free scratch-card, rewards, and instant-win app that launched on Android in 2014 and grew to roughly
  10 million US installs across Android and iOS, consistently ranking near the top of the lifestyle
  category. Founded by Alex Betancur and Tony Vartanian and backed by Bullpen Capital, the company paired
  free-to-play casual gaming with performance-marketing and rewards technology. Jump Ramp Games was
  acquired by MobilityWare in September 2019, which took over the Lucktastic franchise; the
  jumprampgames.com domain now redirects to mobilityware.com. The company exposes no public developer,
  API, or documentation surface, so this profile is maintained as a company record in the API Evangelist
  network rather than an API provider.
